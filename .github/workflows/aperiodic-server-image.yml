# aperiodic-io fork only: builds the server image from core/server/Dockerfile
# and pushes it to ghcr.io/aperiodic-io/iggy, tagged with the commit sha (the
# tag deployments pin) and the branch name.
name: aperiodic server image

on:
  push:
    branches:
      - aperiodic/**
      - feat/message-dedup
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aperiodic-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'aperiodic-io/iggy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tags=ghcr.io/aperiodic-io/iggy:${GITHUB_SHA},ghcr.io/aperiodic-io/iggy:${branch}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/server/Dockerfile
          target: runtime
          # Our clusters run x86 nodes. The Dockerfile's amd64 -> arm64 cross
          # build fails to link the server build script; add arm64 only with a
          # native arm64 runner if it is ever needed.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
